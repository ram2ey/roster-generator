server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Content-hashed build output: safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The shell references the hashed assets above, so it must never be
    # served stale — always revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unmatched paths fall back to the shell rather than
    # a bare 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
