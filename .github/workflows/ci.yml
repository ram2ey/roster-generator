name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: roster
          POSTGRES_PASSWORD: roster
          POSTGRES_DB: roster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roster -d roster_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://roster:roster@127.0.0.1:5432/roster_test
      DATABASE_URL: postgres://roster:roster@127.0.0.1:5432/roster_test
      ALLOW_MIGRATION_TEST_RESET: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run build
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm run test:migrations
        working-directory: server
      - run: npm audit --omit=dev
        working-directory: server
      - run: npx drizzle-kit check
        working-directory: server
      - run: docker build -t roster-generator:${{ github.sha }} .
